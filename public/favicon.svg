<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <!-- Dynamic Brand Gradients -->
    <linearGradient id="magentaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EC008C">
        <animate attributeName="stop-color" values="#EC008C;#FF007A;#8B5CF6;#EC008C" dur="4s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#8B5CF6">
        <animate attributeName="stop-color" values="#8B5CF6;#EC008C;#FF3366;#8B5CF6" dur="4s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <linearGradient id="cyanGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="100%" stop-color="#EC008C" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .bg { fill: #0B0E14; }
    .orbit1 {
      transform-origin: 50px 50px;
      animation: spin 6s linear infinite;
    }
    .orbit2 {
      transform-origin: 50px 50px;
      animation: spin-reverse 8s linear infinite;
    }
    .pulse-core {
      transform-origin: 50px 50px;
      animation: pulse-scale 2.5s ease-in-out infinite;
    }
    .shape1 {
      transform-origin: 50px 50px;
      animation: morph-rotate 5s ease-in-out infinite alternate;
    }
    .shape2 {
      transform-origin: 50px 50px;
      animation: morph-rotate-2 4s ease-in-out infinite alternate;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    @keyframes spin-reverse {
      0% { transform: rotate(360deg); }
      100% { transform: rotate(0deg); }
    }
    @keyframes pulse-scale {
      0%, 100% { transform: scale(0.92); opacity: 0.9; }
      50% { transform: scale(1.08); opacity: 1; filter: drop-shadow(0 0 6px #EC008C); }
    }
    @keyframes morph-rotate {
      0% { transform: rotate(0deg) scale(0.9); }
      100% { transform: rotate(180deg) scale(1.05); }
    }
    @keyframes morph-rotate-2 {
      0% { transform: rotate(45deg) scale(1.05); }
      100% { transform: rotate(-135deg) scale(0.88); }
    }
  </style>

  <!-- Dark Premium Container Tile -->
  <rect class="bg" width="100" height="100" rx="24"/>
  <rect width="96" height="96" x="2" y="2" rx="22" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="1.5"/>

  <!-- Rotating Outer Orbital Dashed Ring -->
  <g class="orbit1">
    <circle cx="50" cy="50" r="38" fill="none" stroke="url(#magentaGrad)" stroke-width="2" stroke-dasharray="8 6" opacity="0.75" />
    <circle cx="88" cy="50" r="3.5" fill="#00F0FF" />
  </g>

  <!-- Reverse Orbital Track with Satellite -->
  <g class="orbit2">
    <circle cx="50" cy="50" r="28" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="1.5" stroke-dasharray="4 8" />
    <circle cx="50" cy="22" r="3" fill="#EC008C" />
  </g>

  <!-- Dynamic Morphing Geometric Prisms in Center -->
  <g class="pulse-core">
    <!-- Rotating Soft Square 1 -->
    <rect class="shape1" x="33" y="33" width="34" height="34" rx="8" fill="none" stroke="url(#magentaGrad)" stroke-width="3" opacity="0.85" />
    
    <!-- Counter-rotating Diamond 2 -->
    <rect class="shape2" x="35" y="35" width="30" height="30" rx="6" fill="url(#magentaGrad)" opacity="0.3" stroke="#00F0FF" stroke-width="1.5" />

    <!-- Center Glowing Creative Engine Core -->
    <circle cx="50" cy="50" r="8" fill="url(#magentaGrad)" filter="url(#glow)"/>
    <circle cx="50" cy="50" r="3.5" fill="#FFFFFF"/>
  </g>
</svg>

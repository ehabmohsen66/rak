<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Crisp Rounded White Background Container -->
  <rect width="100" height="100" rx="22" fill="#FFFFFF"/>
  
  <!-- Centered RAK Group -->
  <g text-anchor="middle" font-family="'Syne', 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-weight="900" font-size="44" letter-spacing="-1">
    <text x="25" y="55" fill="#0F172A">R</text>
    <text x="50" y="55" fill="#EC008C">A</text>
    <text x="75" y="55" fill="#0F172A">K</text>
  </g>
  
  <!-- Centered Subscript '4' -->
  <text x="50" y="78" text-anchor="middle" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-weight="900" font-size="20" fill="#EC008C">4</text>
</svg>
